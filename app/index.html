<!doctype html>
<html lang="en" data-app="bizzing-finance">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bizzington</title>
<meta name="description" content="A town where kids 8+ get a wallet, a budget, a bank and a portfolio that are entirely simulated and entirely theirs.">
<meta name="theme-color" content="#0E6B78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The webfonts must NEVER block first paint. This app is offline-first by
     rule, and a render-blocking stylesheet on a third-party CDN meant that
     offline — or on a bad train, or behind a school firewall — the page sat
     frozen for THIRTEEN SECONDS before a child could type their name.
     Measured: 12,957ms to interactive with this link blocking, 119ms without.
     media="print" makes it non-blocking; the onload promotes it once it has
     actually arrived. Every family in styles/app.css already declares a real
     fallback (Georgia, system-ui), so the app paints immediately in those and
     swaps when the faces land, or simply stays in them for ever. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Hanken+Grotesk:wght@400;500;650;800&family=Sono:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Hanken+Grotesk:wght@400;500;650;800&family=Sono:wght@400;600&display=swap"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
