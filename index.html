<!-- The webfonts are ours, on our own origin, and that is deliberate twice over.
     They used to come from fonts.googleapis.com as a render-blocking stylesheet,
     and a child waited THIRTEEN SECONDS before they could type their name:
     measured 12,957ms to interactive, 119ms with the link removed. Making it
     non-blocking fixed the freeze but left the real problem — this app is
     offline-first by rule, and sw.js deliberately does not cache cross-origin
     responses, so offline the town rendered in Georgia and system-ui and looked
     like a different product. A local stylesheet is not a third-party fetch, so
     there is nothing to block on and nothing to special-case in the worker.
     styles/fonts.css has the faces and the licence trail. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
  <script type="module" crossorigin src="./assets/index-BcrYJcdm.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-HiR1iykz.css">
