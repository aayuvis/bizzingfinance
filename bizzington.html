<!doctype html>
<html lang="en" data-app="bizzing-finance">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bizzington</title>
<meta name="description" content="A town where kids 8+ get a wallet, a budget, a bank and a portfolio that are entirely simulated and entirely theirs.">
<meta name="theme-color" content="#0E6B78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Hanken+Grotesk:wght@400;500;650;800&family=Sono:wght@400;600&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ================================================================
   BIZZING FINANCE TOKENS v1
   Inherits the family contract from Bizzing Bee's ds-src:
   · ACTION (world accent) = "do it". One filled action per screen.
   · TREASURE gold = money you have earned. Never a button.
   · GROW green / SPEND coral = money states. Never decoration.
   · Everything you READ is ink on paper.
   The world accent here is intaglio teal, because gold is already
   treasure and green is already growth — neither can be a button.
   ================================================================ */
:root{
  --display:"Fraunces",Georgia,serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --mono:"Sono",ui-monospace,monospace;

  --fs-meta:12px; --fs-label:13px; --fs-body:15px; --fs-lead:17px;
  --fs-h3:20px; --fs-h2:24px; --fs-h1:30px;

  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;

  /* fixed semantics — identical in both modes */
  --treasure:#F0B429; --treasure-tint:#FFF3D6; --treasure-deep:#8A5B00;
  --grow:#178A4C;     --grow-tint:#E3F3E9;
  --spend:#C4453C;    --spend-tint:#FBE9E7;
  --give:#8A5BD6;     --give-tint:#EFE8FB;
  --save:#2E7FA8;     --save-tint:#E2EFF6;
}

/* ---- light (the bare root) ---- */
:root{
  --paper:#FFFCF5; --surface:#FFFFFF; --surface2:#F4F6F5;
  --tint:#EDF2F2; --line:#DCE5E4; --line-soft:#E9EFEE;
  --ink:#16262A; --muted:#5B7075;
  --action:#0E6B78; --action-ink:#FFFFFF; --action-tint:#E2EFF1;
  --sky1:#CFE9EE; --sky2:#F6EFDC; --ground:#DCCFA8; --road:#C9BE9C;
  --sh:0 1px 2px rgb(12 30 34 / .05);
  --sh-raised:0 2px 6px rgb(12 30 34 / .07), 0 12px 30px rgb(12 30 34 / .07);
  --sh-overlay:0 24px 64px rgb(12 30 34 / .28);
  --edge:inset 0 -2.5px 0 rgb(0 0 0 / .16);
  --focus:0 0 0 3px color-mix(in srgb,var(--action) 34%,transparent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-mode="light"]){
    --paper:#0F1A1D; --surface:#16252A; --surface2:#1B2E34;
    --tint:#132025; --line:#24373D; --line-soft:#1C2C32;
    --ink:#E4EDEE; --muted:#93A7AC;
    --action:#3FAEBC; --action-ink:#06262B; --action-tint:#12333A;
    --treasure-tint:#33280F; --treasure-deep:#F0C25A;
    --grow:#5BC98C; --grow-tint:#0F2E20;
    --spend:#EC8B81; --spend-tint:#331916;
    --give:#B79BEC; --give-tint:#241A38;
    --save:#6EB6D8; --save-tint:#122B36;
    --sky1:#1B333A; --sky2:#22303A; --ground:#2A3A34; --road:#243029;
    --sh:0 1px 2px rgb(0 0 0 / .4);
    --sh-raised:0 2px 6px rgb(0 0 0 / .35), 0 12px 30px rgb(0 0 0 / .45);
    --sh-overlay:0 24px 64px rgb(0 0 0 / .6);
  }
}
:root[data-mode="dark"]{
  --paper:#0F1A1D; --surface:#16252A; --surface2:#1B2E34;
  --tint:#132025; --line:#24373D; --line-soft:#1C2C32;
  --ink:#E4EDEE; --muted:#93A7AC;
  --action:#3FAEBC; --action-ink:#06262B; --action-tint:#12333A;
  --treasure-tint:#33280F; --treasure-deep:#F0C25A;
  --grow:#5BC98C; --grow-tint:#0F2E20;
  --spend:#EC8B81; --spend-tint:#331916;
  --give:#B79BEC; --give-tint:#241A38;
  --save:#6EB6D8; --save-tint:#122B36;
  --sky1:#1B333A; --sky2:#22303A; --ground:#2A3A34; --road:#243029;
  --sh:0 1px 2px rgb(0 0 0 / .4);
  --sh-raised:0 2px 6px rgb(0 0 0 / .35), 0 12px 30px rgb(0 0 0 / .45);
  --sh-overlay:0 24px 64px rgb(0 0 0 / .6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:var(--fs-body); line-height:1.55; font-weight:450;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:800; margin:0; line-height:1.1; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left}
input{font:inherit; color:inherit}
:focus-visible{outline:none; box-shadow:var(--focus); border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── shell ───────────────────────────────────────────────────── */
#app{min-height:100dvh; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:940px;margin:0 auto;width:100%;padding:10px clamp(12px,3vw,24px);display:flex;align-items:center;gap:9px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand em{font-style:italic;font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.chip{font-size:13px;font-weight:800;padding:6px 11px;border-radius:var(--r-pill);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.chip.money{background:var(--treasure-tint);color:var(--treasure-deep);border:1px solid color-mix(in srgb,var(--treasure) 45%,transparent)}
.chip.streak{background:var(--spend-tint);color:var(--spend)}
.nav{max-width:940px;margin:0 auto;width:100%;padding:0 clamp(12px,3vw,24px) 8px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navbtn{font-family:var(--display);font-weight:800;font-size:14px;padding:7px 14px;border-radius:var(--r-pill);color:var(--muted);white-space:nowrap}
.navbtn[aria-current="page"]{background:var(--action);color:var(--action-ink)}
.content{max-width:940px;margin:0 auto;width:100%;padding:16px clamp(12px,3vw,24px) 92px;flex:1}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;padding:5px 2px;border-radius:10px;color:var(--muted);text-align:center}
.tabbar button[aria-current="page"]{background:var(--action-tint);color:var(--action)}
.tabbar .gl{font-size:17px;line-height:1}
@media (min-width:760px){ .tabbar{display:none} .content{padding-bottom:40px} }
@media (max-width:759px){ .nav{display:none} }

/* ── cards & bits ────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px}
.card.pad0{padding:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.big{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tabnum{font-variant-numeric:tabular-nums}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--r-md);
  background:var(--action);color:var(--action-ink);font-weight:800;font-size:15px;box-shadow:var(--edge);
  transition:transform .08s ease; text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:8px 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--muted);background:var(--tint)}
.pill.gold{color:var(--treasure-deep);background:var(--treasure-tint);border-color:color-mix(in srgb,var(--treasure) 45%,transparent)}
.pill.grow{color:var(--grow);background:var(--grow-tint);border-color:color-mix(in srgb,var(--grow) 35%,transparent)}
.bar{height:9px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--action);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.sep{height:1px;background:var(--line-soft);margin:2px 0}

/* ── money strip ─────────────────────────────────────────────── */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
@media (max-width:460px){ .strip{grid-template-columns:repeat(2,1fr)} }
.strip.three{grid-template-columns:repeat(3,1fr)}
.strip.two{grid-template-columns:repeat(2,1fr)}
.strip > div{background:var(--surface);padding:11px 10px}
.strip .k{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.strip .v{font-family:var(--display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:1px}

/* ── town ────────────────────────────────────────────────────── */
.town{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh-raised);background:var(--sky1)}
.town-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

.town svg{display:block;width:100%;height:auto}
.town .hot{cursor:pointer}
@media (max-width:700px){
  /* a street too small to read is a texture, not a place. Let them pan it. */
  .town .town-scroll > svg{width:720px;max-width:none}
}
.town .hot:hover .bldg-glow{opacity:.5}
.town-cap{position:absolute;right:10px;top:10px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none;height:max-content}
.town-cap span{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--ink);border-radius:var(--r-pill);padding:3px 9px;backdrop-filter:blur(6px)}

/* ── speech ──────────────────────────────────────────────────── */
.say{display:flex;gap:11px;align-items:flex-start}
.say .who{width:52px;height:52px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.say .who svg{display:block;width:100%;height:100%}
.say .bub{background:var(--surface2);border:1px solid var(--line);border-radius:4px var(--r-lg) var(--r-lg) var(--r-lg);padding:11px 13px;font-size:14.5px;line-height:1.5;flex:1;min-width:0}
.say .bub b{font-weight:800}
.say .nm{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

/* ── jars ────────────────────────────────────────────────────── */
.jars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.jar{display:flex;flex-direction:column;align-items:center;gap:6px}
.jarglass{position:relative;width:100%;max-width:88px;aspect-ratio:.74;max-height:130px;border-radius:7px 7px 14px 14px;border:2px solid var(--line);background:var(--tint);overflow:hidden;box-shadow:inset 0 0 0 3px rgb(255 255 255 / .35)}
.jarglass::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--line-soft);border-radius:5px 5px 0 0}
.jarfill{position:absolute;left:0;right:0;bottom:0;transition:height .6s cubic-bezier(.2,.8,.3,1)}
.jarlbl{font-size:11.5px;font-weight:800;text-align:center;line-height:1.2}
.jaramt{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:420px){ .jars{gap:7px} }

/* ── modal / overlay ─────────────────────────────────────────── */
.ov{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:rgb(8 20 24 / .62);animation:fade .18s ease both}
.ovbox{position:relative;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-overlay);max-width:460px;width:100%;padding:22px;animation:pop .38s cubic-bezier(.2,1.5,.4,1) both;max-height:90dvh;overflow:auto}
.ovbox.wide{max-width:680px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
.conf{position:fixed;inset:0;z-index:130;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-8%;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(118vh) rotate(680deg)}}
.toast{
  position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:110;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-pill);
  font-weight:800;font-size:14px;box-shadow:var(--sh-raised);animation:toastin .3s ease both;max-width:90vw;text-align:center;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ── learn ───────────────────────────────────────────────────── */
.chapts{display:grid;gap:12px}
.opt{display:block;width:100%;padding:13px 15px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--action) 45%,var(--line))}
.opt.ok{border-color:var(--grow);background:var(--grow-tint)}
.opt.no{border-color:var(--spend);background:var(--spend-tint)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:8px}

/* ── games ───────────────────────────────────────────────────── */
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-height:330px;display:flex;flex-direction:column;gap:12px}
.gcard{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 16px;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
.gcard .em{font-size:38px;line-height:1;display:block;margin-bottom:6px}
.gcard .nm{font-family:var(--display);font-weight:800;font-size:21px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.hud{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px;flex-wrap:wrap}
.hud .box{background:var(--tint);border-radius:var(--r-sm);padding:4px 9px;font-variant-numeric:tabular-nums}
.alloc{display:grid;gap:8px}
.alrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px}
.alrow.sel{border-color:var(--action);box-shadow:var(--focus)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:16px}
.stepper .n{min-width:42px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:44px}
.lead{display:grid;gap:6px}
.leadrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface2);font-size:13.5px;font-weight:700}
.leadrow.me{background:var(--action-tint);color:var(--action)}
.leadrow .p{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

/* ── print: the grown-up's weekly page ───────────────────────────────── */
#printsheet{display:none}
@media print{
  body.printing .topbar,body.printing .tabbar,body.printing .content,body.printing .ov{display:none!important}
  body.printing #printsheet{display:block;padding:24px;color:#000;background:#fff;font-family:Georgia,serif}
  #printsheet h1{font-size:22px;margin:0 0 4px}
  #printsheet h2{font-size:14px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.08em}
  #printsheet ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
  #printsheet p{font-size:13px}
}

</style>

    for (let i = 0; i < card.id.length; i++) {
      h ^= card.id.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    const idx = card.drill.opts.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      h = Math.imul(h ^ h >>> 15, 2246822507);
      h >>>= 0;
      const j = h % (i + 1);
      const t = idx[i];
      idx[i] = idx[j];
      idx[j] = t;
    }

  function makeSeries(steps) {
    const out = {};
    ASSETS.forEach((a, ai) => {
      const r = rng(9301 + ai * 7919);
      let p = 100;
      const arr = [p];
      for (let i = 0; i < steps; i++) {
        const shock = (r() + r() + r() - 1.5) * 2 * a.vol;
        const crash = i === Math.floor(steps * 0.55) ? -a.vol * 3.1 : 0;
        p = Math.max(6, p * (1 + a.drift + shock + crash));
        arr.push(p);
      }
      out[a.id] = arr;
    });
    return out;
  }

    b.stock[id] = (b.stock[id] || 0) + qty;
    return true;
  }
  function bizPrice(c, id, d) {
    const b = c.biz, s = STOCK.find((x) => x.id === id);
    const floor = Math.max(1, Math.round(price(s.cost) * 0.5));
    b.prices[id] = Math.max(floor, b.prices[id] + d);
  }
  function bizTrade(c) {
    const b = c.biz;
    const w = WEATHER[Math.floor(seededRandom(b.day * 7919 + 13) * WEATHER.length)];
    b.weather = w.id;
    let revenue = 0, sold = {}, spoiled = {};
    STOCK.forEach((s) => {
      const have = b.stock[s.id] || 0;
      if (!have) return;
      const base = 9 * (w.mult[s.id] || 1);
      const fair = price(s.sells);
      const elasticity = Math.pow(fair / Math.max(1, b.prices[s.id]), 1.6);
      const want = Math.max(0, Math.round(base * elasticity * (0.75 + seededRandom(b.day * 31 + s.id.length) * 0.5)));
      const n = Math.min(have, want);
      sold[s.id] = n;
      revenue += n * b.prices[s.id];
      b.stock[s.id] = have - n;
      if (s.id === "ice" && b.stock[s.id] > 0) {
        spoiled[s.id] = b.stock[s.id];
        b.stock[s.id] = 0;
      }
    });
    const rent = b.rent;
    b.cash += revenue - rent;
    const profit = revenue - rent;
    b.log.unshift({ day: b.day, weather: w.id, revenue, rent, profit, sold, spoiled });
    if (b.log.length > 20) b.log.length = 20;
    b.day++;
    b.best = Math.max(b.best, profit);
    badge(c, "shopkeeper");
    questTick(c, "trade", 1);
    if (profit > 0) badge(c, "profit-day");
    stamp(c);
    return { weather: w, revenue, rent, profit, sold, spoiled };
  }
  function seededRandom(n) {
    let s = n >>> 0 || 1;
    s ^= s << 13;
    s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;
    s >>>= 0;
    return s / 4294967296;
  }
  function bizCashOut(c) {
    const b = c.biz;
    if (!b) return 0;
    const keep = price(20);
    const take = Math.max(0, Math.round(b.cash - keep));
    if (take <= 0) return 0;
    b.cash -= take;

  }

    m.wallet = f(m.wallet);

    ["spend", "save", "grow", "give"].forEach((k2) => {

      }
    }
    const res = addXP(c, ch.xp || 0);
    if (ch.badge) badge(c, ch.badge);
    c.postbox.answered = true;
    c.postbox.log.push({ id: L.id, scam: !!L.scam, safe: !!ch.safe, t: Date.now() });
    questTick(c, "letter", 1);
    if (L.scam && ch.safe) questTick(c, "scam", 1);
    stamp(c);
    R.overlay.result = { note: ch.note, money: delta, xp: ch.xp || 0, badge: ch.badge, good: !(L.scam && !ch.safe) };
    if (delta > 0) sfx.coin();
    else if (L.scam && !ch.safe) sfx.bad();
    else sfx.good();
    render();
    if (res.leveled) setTimeout(() => levelUp(res), 900);
  });
  on("payday", () => {
    const c = C();
    if (!payDue(c, R.s)) {
      toast("Not yet \u2014 the bell rings on " + weekday(c.money.nextPay));
      return;
    }
    R.overlay = { kind: "payday", res: runPayDay(c, R.s) };
    sfx.bell();
    confetti(30);
    render();
  });
  on("skipWeek", () => {
    protoSkipWeek(C(), R.s);
    toast("Clock pushed to pay day");
    fire("nav", "home");
  });
  on("grantXP", () => {
    const res = addXP(C(), 200);
    if (res.leveled) levelUp(res);
    else {
      toast("+200 XP");
      render();
    }
  });
  on("wipe", () => {
    if (!confirm("Start this household over? Every town in it goes.")) return;
    try {
      localStorage.removeItem("bzf_profile");
      localStorage.removeItem("bzf_v1");
    } catch (e) {
    }
    R.s = null;
    draft = { step: 0 };
    location.hash = "";
    render();
  });
  on("job", (id) => {
    const a = doJob(C(), id);
    if (a) {
      sfx.coin();
      toast("+" + money(a));
    } else toast("Done that one today");
    render();
  });
  on("jarIn", (k) => {
    toJar(C(), k, price(2)) ? sfx.coin() : toast("Wallet is empty");
    render();
  });
  on("jarOut", (k) => {
    fromJar(C(), k, price(2)) ? sfx.click() : toast("That jar is empty");
    render();
  });
  on("rule", (arg) => {
    const [k, d] = arg.split(":"), r = C().money.rules;
    r[k] = Math.max(0, Math.min(100, r[k] + +d));
    sfx.click();
    render();
  });
  on("addGoal", () => {
    const n = (R.fields.goalName || "").trim();
    const a = parseInt(String(R.fields.goalAmt || "").replace(/[^0-9]/g, ""), 10);
    if (!n) {
      toast("Name it first");
      return;
    }
    if (!a || a <= 0) {
      toast("How much does it cost?");
      return;
    }
    addGoal(C(), n, a);
    R.fields.goalName = "";
    R.fields.goalAmt = "";
    sfx.good();
    toast("Scaffolding up");
    render();
  });
  on("fundGoal", (id) => {
    if (!fundGoal(C(), id, price(5))) {
      toast("The Save jar is empty");
      return;
    }
    const g = C().money.goals.find((x) => x.id === id);
    if (g && g.done) {
      sfx.level();
      confetti(40);
      toast("Built it!");
    } else sfx.coin();
    render();
  });
  on("autoGoal", (id) => {
    const g = C().money.goals.find((x) => x.id === id);
    if (!g) return;
    g.auto = g.auto ? 0 : price(5);
    toast(g.auto ? "Will move " + money(g.auto) + " every pay day" : "Auto-save off");
    sfx.click();
    render();
  });
  on("raidGoal", (id) => {
    if (raidGoal(C(), id)) {
      sfx.bad();
      toast("Scaffolding came down");
    }
    render();
  });
  on("bankIn", () => {
    bankIn(C(), price(10)) ? sfx.coin() : toast("Nothing in the Save jar");
    render();
  });
  on("bankOut", () => {
    bankOut(C(), price(10));
    sfx.click();
    render();
  });
  on("loan", () => {
    const c = C();
    const offer = loanOffer(c, 40, 8);
    if (!confirm(`Borrow ${money(offer.amount)}?

You pay back ${money(offer.perWeek)} every pay day for ${offer.weeks} pay days.
You hand over ${money(offer.total)} in total.
So it costs ${money(offer.cost)}.`)) return;
    takeLoan(c, offer);
    sfx.coin();
    toast("Borrowed \u2014 and you knew the cost first");
    render();
  });
  on("repay", () => {
    const a = repayLoan(C(), C().money.wallet);
    if (a) {
      sfx.coin();
      toast("Repaid " + money(a));
    }
    render();
  });
  on("buy", (id) => {
    if (!buyAsset(C(), id, price(5))) {
      toast("Fill the Grow jar first");
      return;
    }
    sfx.coin();
    render();
  });
  on("sell", (id) => {
    sellAsset(C(), id);
    sfx.click();
    render();
  });
  on("openBiz", () => {
    openBiz(C());
    sfx.level();
    confetti(30);
    render();
  });
  on("bizBuy", (id) => {
    bizBuy(C(), id, 5) ? sfx.coin() : toast("Not enough in the till");
    render();
  });
  on("bizPrice", (arg) => {
    const [id, d] = arg.split(":");
    bizPrice(C(), id, price(1) * +d);
    sfx.click();
    render();
  });
  on("bizTrade", () => {
    const c = C();
    const any = STOCK.some((s) => (c.biz.stock[s.id] || 0) > 0);
    if (!any) {
      toast("Buy something to sell first");
      sfx.bad();
      return;
    }
    const day = bizTrade(c);
    R.overlay = { kind: "biz", day };
    if (day.profit >= 0) sfx.coin();
    else sfx.bad();
    render();
  });
  on("bizCashOut", () => {
    const a = bizCashOut(C());
    if (a) {
      sfx.coin();
      toast("Drew " + money(a) + " from the till");
    }
    render();
  });
  on("cool", (id) => {
    C().shop.cooling[id] = Date.now() + 24 * 36e5;
    toast("Come back tomorrow \u2014 see if you still want it");
    sfx.click();
    render();
  });
  on("buyItem", (id) => {
    const c = C(), it = SHOP.find((x) => x.id === id), p = price(it.units);
    let short = p - c.money.wallet;
    if (short > 0) {
      const take = Math.min(short, c.money.jars.spend);
      c.money.jars.spend -= take;
      c.money.wallet += take;
      short -= take;
    }
    if (short > 0) {
      toast("Not enough \u2014 even after the Spend jar");
      sfx.bad();
      return;
    }
    c.money.wallet -= p;
    txn(c, "out", p, it.name, "shop");
    c.shop.owned.push(id);
    stamp(c);
    sfx.coin();
    toast(it.name + " is yours");
    render();
  });
  on("move", (t) => {
    const c = C(), tier = +t, h = HOMES[tier];
    const chk = canMove(c, tier);
    if (!chk.ok) {
      toast(chk.why);
      sfx.bad();
      return;
    }
    if (!moveHome(c, tier)) {
      toast("Could not move");
      return;
    }
    sfx.level();
    confetti(45);
    R.overlay = { kind: "moved", home: h };
    render();
  });
  on("allow", (d) => {
    const c = C(), step = price(5);
    if (c.family.allowance == null) c.family.allowance = +d > 0 ? step : null;
    else {
      const v = c.family.allowance + step * +d;
      c.family.allowance = v < step ? null : v;
    }
    sfx.click();
    render();
  });
  on("coolOff", () => {
    C().family.coolOff = !C().family.coolOff;
    sfx.click();
    render();
  });
  on("chore", (i) => {
    const ch = C().family.chores[i];
    ch.done = !ch.done;
    sfx.click();
    render();
  });
  on("choreAdd", () => {
    const n = (R.fields.choreName || "").trim();
    const a = parseInt(String(R.fields.choreAmt || "").replace(/[^0-9]/g, ""), 10);
    if (!n || !a) {
      toast("A job and an amount");
      return;
    }
    C().family.chores.push({ name: n, amt: a, done: false });
    R.fields.choreName = "";
    R.fields.choreAmt = "";
    sfx.good();
    render();
  });
  on("choreDel", (i) => {
    C().family.chores.splice(+i, 1);
    render();
  });
  on("switchKid", (i) => {
    R.s.active = +i;
    setCurrency(C().currency);
    touchDay(C());
    R.s.ui = { nav: "home", sub: "wallet" };
    sfx.click();
    toast("Now playing as " + C().name);
    render();
  });
  on("addKid", () => {
    R.adding = true;
    draft = { step: 0 };
    R.fields = {};
    render();
  });
  on("band", () => {
    const c = C();
    c.band = c.band === "sprout" ? "builder" : "sprout";
    sfx.click();
    render();
  });
  on("print", () => {
    document.body.classList.add("printing");
    const c = C();
    const w = document.createElement("div");
    w.id = "printsheet";
    w.innerHTML = `<h1>${esc(c.name)} \xB7 Bizzington</h1>
    <p>Week to ${(/* @__PURE__ */ new Date()).toLocaleDateString()} \xB7 level ${c.learn.level} \xB7 ${rankFor(c.learn.level)}</p>
    <h2>Money</h2>
    <p>Wallet ${money(c.money.wallet)} \xB7 jars ${money(jarTotal(c))} \xB7 bank ${money(c.money.bank.balance)} \xB7
       invested ${money(holdingsValue(c))} \xB7 <b>net worth ${money(netWorth(c))}</b></p>
    <h2>Chapters</h2>
    <ul>${CHAPTERS.map((ch) => `<li>${esc(ch.title)} \u2014 ${ch.cards.filter((x) => c.learn.done[x.id]).length}/${ch.cards.length}</li>`).join("")}</ul>
    <h2>Recent movements</h2>
    <ul>${c.money.txns.slice(0, 20).map((t) => `<li>${new Date(t.t).toLocaleDateString()} \u2014 ${esc(t.label)} \u2014 ${t.kind === "in" ? "+" : "\u2212"}${money(t.amt)}</li>`).join("")}</ul>
    <p style="margin-top:18px;font-size:11px">Simulated money only. Bizzing Finance never touches real money.</p>`;
    document.body.appendChild(w);
    setTimeout(() => {
      try {
        window.print();
      } catch (e) {
        toast("Printing is not available here");
      }
      setTimeout(() => {
        w.remove();
        document.body.classList.remove("printing");
      }, 400);
    }, 60);
  });
  on("game", (id) => {
    const c = C();
    questTick(c, "game", 1);
    if (id === "mn") questTick(c, "board", 1);
    startGame(id);
    render();
  });
  on("gquit", () => {
    quitGame();
    const c = C();
    const next = ALL_CARDS.find((x) => !c.learn.done[x.id] && C().learn.level >= CHAPTERS.find((ch) => ch.id === x.ch).lv);
    if (next && Math.random() < 0.7) R.overlay = { kind: "between", card: next };
    render();
  });
  GAME_ACTS.forEach((a) => {
    on(a, (arg) => {
      if (R.game && R.game.act) R.game.act(a, arg);
    });
  });
  bindRoot(document.body);
  document.body.addEventListener("input", (e) => {
    const f = e.target.getAttribute && e.target.getAttribute("data-field");
    if (!f) return;
    R.fields[f] = e.target.value;
    if (e.target.getAttribute("data-live")) liveField(f, e.target.value);
  });
  document.body.addEventListener("change", (e) => {
    const f = e.target.getAttribute && e.target.getAttribute("data-field");
    if (f && e.target.getAttribute("data-live")) liveField(f, e.target.value);
  });
  function liveField(f, v) {
    if (f === "query") {
      R.query = v;
      render();
      requeue("query");
    } else if (f === "cur") {
      changeCurrency(C(), v);
      toast("Converted to " + CURRENCIES[v].name);
      render();
    } else if (f === "payday") {
      setPayWeekday(C(), +v);
      toast("Pay day moves to " + ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][+v]);
      render();
    }
  }
  function requeue(field) {
    const el = document.querySelector(`[data-field="${field}"]`);
    if (el) {
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }
  document.addEventListener("keyup", (e) => {
    if (R.game && R.game.keyup && !R.overlay) R.game.keyup(e);
  });
  document.addEventListener("keydown", (e) => {
    if (R.game && R.game.key && !R.overlay) {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", " "].includes(e.key) && document.activeElement && document.activeElement.tagName !== "INPUT") e.preventDefault();
      R.game.key(e);
      return;
    }
    if (e.key === "Escape" && R.overlay) {
      R.overlay = null;
      render();
    }
  });
  window.addEventListener("hashchange", () => {
    if (routing || !R.s || !R.s.kids.length) return;
    if (readHash()) {
      R.overlay = null;
      if (R.game) quitGame();
      render();
    }
  });
  try {
    R.mode = localStorage.getItem("bzf_mode") || null;
  } catch (e) {
    R.mode = null;
  }
  if (R.mode) document.documentElement.setAttribute("data-mode", R.mode);
  R.s = load();
  if (R.s && R.s.kids.length) {
    setSound(R.s.settings.sound);
    touchDay(kid(R.s));
    readHash();
  }
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.BZF_SINGLE) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
      });
    });
  }
  window.BZF = { R, sim: sim_exports, allCards: ALL_CARDS, key: (id) => shuffledDrill(ALL_CARDS.find((c) => c.id === id)).answer };
})();

</script>
</body>
</html>
